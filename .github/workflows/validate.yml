name: Structural and offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate contracts
        run: python scripts/validate_workflows.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Generate structural reports
        run: |
          python scripts/report_coverage.py --format json > coverage.json
          python scripts/topology_analysis.py --format json > topology.json
